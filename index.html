<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Journal</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

            <link
                rel="stylesheet"
                href="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.snow.css"
            >


<body>

    <!-- LOGIN PAGE -->

    <div
        id="loginPage"
        class="login-container"
    >

        <div class="login-box">

            <h1 class="heading">
                日誌
            </h1>

            <input
                type="email"
                id="email"
                placeholder="Email"
                autocomplete="email"
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                autocomplete="current-password"
            >

            <button onclick="login()">
                Login
            </button>

        </div>

    </div>

    <!-- JOURNAL PAGE -->

    <div
        id="journalPage"
        class="hidden"
    >

        <header>

            <h1>
                My Journal
            </h1>

<div class="navbtns">
                <button
                class="journal-btn"
                onclick="journal()"
            >
                Habits
            </button>


            <button
                class="logout-btn"
                onclick="logout()"
            >
                Logout
            </button>

</div>


        </header>

        <!-- CREATE ENTRY -->

        <section class="entry-form">

            <h2>
                Write your Entry
            </h2>

            <input
                type="text"
                id="title"
                placeholder="Entry Title"
            >

            <input
                type="file"
                id="media"
                accept="image/*"  
            
            >

            <div id="editor"></div>

            <button
                onclick="addEntry()"
            >
                Post Entry
            </button>

        </section>

        <!-- ENTRIES -->

        <section
            id="EntriesContainer"
        ></section>

        <!-- PAGINATION -->

        <div class="pagination">

            <button
                onclick="prevPage()"
            >
                Previous
            </button>

            <span id="pageNumber">
                Page 1
            </span>

            <button
                onclick="nextPage()"
            >
                Next
            </button>

        </div>

    </div>

    <footer>

        <p>
            v.1.0.3
        </p>

    </footer>

    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- APP -->

    <script src="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.min.js"></script>

    <script src="script.js"></script>

</body>
</html>
